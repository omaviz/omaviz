name: Tests (QML + JS + engine contract)

# Functional JS, physics, config, protocol and bundled-engine tests.
# Native Quickshell components are exercised locally with npm run test:qml;
# Ubuntu does not ship the host's shell modules. No source-string UI tests.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show bundled engine (committed artifact)
        run: ls -la bin/omaviz-engine && file bin/omaviz-engine || true

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install runtime + tooling deps
        run: |
          sudo apt-get update -qq
          # The shipped engine links against PipeWire — the plugin's real audio
          # backend, and present on every Omarchy system. The bare runner does
          # not ship it (t64-suffixed on Ubuntu 24.04), so the engine cannot
          # even start without this.
          sudo apt-get install -y -qq libpipewire-0.3-0t64 \
            || sudo apt-get install -y -qq libpipewire-0.3-0


      # Fail loudly and specifically if the binary cannot load, instead of
      # surfacing as a pile of confusing empty-frame assertions below.
      - name: Verify the bundled engine can actually load
        run: |
          if ldd bin/omaviz-engine | grep -qi "not found"; then
            echo "::error::bundled engine has unresolved shared libraries:"
            ldd bin/omaviz-engine
            exit 1
          fi
          echo "engine runtime deps resolved:"
          ldd bin/omaviz-engine

      # Run the same entry point developers run, so the two cannot drift.
      # NOTE: `node --test tests/` (a bare directory) does NOT discover tests on
      # Node 24 — it tries to execute `tests` as a script — so the glob is
      # explicit and Node-version independent.
      - name: Run test suite
        run: npm test

      # Installer/uninstaller safety: runs the REAL scripts against a throwaway
      # $HOME with stubbed omarchy commands, asserting the marketplace contract
      # (never delete unowned files; marker-scoped uninstall; no traversal).
      - name: Run installer safety tests
        run: npm run test:installer
