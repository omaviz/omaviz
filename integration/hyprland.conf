# omaviz Hyprland integration.
# Source from ~/.config/hypr/hyprland.conf:
#   source = ~/.config/hypr/omaviz.conf

# Desktop mode should float — it is a widget, not a tiled app.
windowrulev2 = float, class:^(omaviz)$, title:^(omaviz)$
windowrulev2 = size 640 200, class:^(omaviz)$
windowrulev2 = move 100%-660 60, class:^(omaviz)$
# Keep it out of the way and non-focus-stealing.
windowrulev2 = noinitialfocus, class:^(omaviz)$
windowrulev2 = nofocus, class:^(omaviz)$

# Keybinds
bind = SUPER, V, exec, omaviz desktop
bind = SUPER SHIFT, V, exec, omaviz full
