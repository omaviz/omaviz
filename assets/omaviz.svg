<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <radialGradient id="g" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff5d73" stop-opacity="0.0"/>
      <stop offset="70%" stop-color="#ff5d73" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ff5d73" stop-opacity="0.28"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff8a9b"/>
      <stop offset="100%" stop-color="#ff3d63"/>
    </linearGradient>
  </defs>

  <!-- soft circular glow, transparent center -->
  <circle cx="64" cy="64" r="60" fill="url(#g)"/>

  <!-- circular ring -->
  <circle cx="64" cy="64" r="52" fill="none" stroke="url(#ring)" stroke-width="6" stroke-opacity="0.85"/>

  <!-- pulse / heartbeat glyph -->
  <path d="M30 64 H46 L54 44 L66 86 L74 64 H98"
        fill="none" stroke="url(#ring)" stroke-width="7"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
