name = "equalizer"
label = "Equalizer"
description = "Classic stacked bar spectrum — the bar widget's default look."

[[params]]
name = "bar_count"
label = "Bar count"
default = 32
min = 8
max = 64
type = "int"

[[params]]
name = "color_scheme"
label = "Colour scheme"
default = 0
min = 0
max = 2
type = "int"
help = "0=theme, 1=warm, 2=cool"

[[params]]
name = "peak_fall"
label = "Peak fall speed"
default = 0.5
min = 0.0
max = 1.0
type = "float"
help = "How fast peaks decay after a spike."
