name = "fire"
label = "Fire"
description = "Warm orange/red flame bars with liquid edge effect."

[[params]]
name = "intensity"
label = "Intensity"
default = 0.8
min = 0.1
max = 2.0
type = "float"
help = "Overall brightness multiplier."

[[params]]
name = "color_temp"
label = "Colour temperature"
default = 0.5
min = 0.0
max = 1.0
type = "float"
help = "0=red, 1=yellow-orange."

[[params]]
name = "borderless"
label = "Borderless"
default = true
type = "boolean"
help = "Hide bar edges for a smoother look."

[[params]]
name = "liquid_edge"
label = "Liquid edge"
default = false
type = "boolean"
help = "Apply a wavy displacement to bar tops."
