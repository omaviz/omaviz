name = "wave"
label = "Wave"
description = "Smooth sine-wave bars with brightness control."

[[params]]
name = "amplitude"
label = "Amplitude"
default = 0.7
min = 0.1
max = 1.5
type = "float"
help = "Wave height multiplier."

[[params]]
name = "frequency"
label = "Frequency"
default = 1.0
min = 0.2
max = 3.0
type = "float"
help = "Number of wave cycles across the display."

[[params]]
name = "brightness"
label = "Brightness"
default = 0.6
min = 0.1
max = 1.0
type = "float"
help = "Base brightness of the wave."

[[params]]
name = "peak_fall"
label = "Peak fall speed"
default = 0.3
min = 0.0
max = 1.0
type = "float"
help = "How fast peaks decay after a spike."
